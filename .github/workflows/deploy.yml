name: Build and deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer deployment supersedes a still-running deployment for the same branch.
concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm build

      - name: Validate deployment credentials
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "::error::Missing EC2_HOST Actions variable."; exit 1; }
          test -n "$EC2_USER" || { echo "::error::Missing EC2_USER Actions variable."; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing SSH_PRIVATE_KEY repository secret."; exit 1; }

      - name: Upload site over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          local_path: ./.vitepress/dist/*
          remote_path: /var/www/prairiehq-docs
          sftp_only: true
